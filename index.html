/* V4: 純班幣版，保留週薪與卡包操作 */
.payroll-switch{padding:11px 14px;background:#f2f6ff;border:1px solid #e4eaf8;border-radius:12px;margin:0 0 12px}
.payroll-switch label{font-size:13px;font-weight:800;color:#64779c;display:block;margin-bottom:6px}
.payroll-switch select{width:min(340px,100%);padding:10px;border:1px solid #cedbf0;border-radius:10px;background:white}
.salary-success{margin:8px 0 0;font-size:12px;color:#3c8161}
.walletcard{border:1px solid #dfebf1;background:linear-gradient(125deg,#f8fcff,#fffaf1);border-radius:17px;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.walletcard h3{font-size:17px;margin:0 0 4px}
.walletcard p{font-size:13px;color:#74849b;margin:0 0 9px}
.walletcards{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(265px,1fr))}
.walletcard .action{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pilltoggle{padding:8px 13px;border-radius:99px;background:#f0f3f9;color:#62758f;border:1px solid #dae4f2;font-weight:700}
.pilltoggle.active{background:#637da6;color:#fff}
.promptline{border-left:4px solid #7eb8a0;background:#eaf8f1;border-radius:10px;padding:9px 12px;margin:10px 0;color:#3d7c60;font-size:13px}

/* 極簡存摺視覺：不再顯示角色、造型店或其虛擬道具 */
.bankpassbook{background:linear-gradient(165deg,#fff 0%,#fff 65%,#f5f9ff 100%)}
.passbook-head{border-radius:14px 14px 0 0;background:#d8e9fa;color:#45648b;padding:12px 15px;display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13px}
.passbook-head span+span{font-size:11px;opacity:.8;letter-spacing:.05em}
.passbook-balance{padding:19px 15px 14px;border:1px solid #dce6f2;border-top:0;background:#fff}
.passbook-balance .number{font-size:40px;color:#344f79;white-space:nowrap}
.passbook-detail{border:1px solid #dce6f2;border-top:1px dashed #dce6f2;border-radius:0 0 14px 14px;background:#fff;padding:10px 15px;display:flex;justify-content:space-between;font-size:12px;color:#71839c}
@media(max-width:840px){.passbook-balance .number{font-size:36px}}

/* V5.1 扣分流程：明確標示學生、快速扣分及可見狀態 */
.selected-student-alert{border:1px solid #ebdce1;background:#fff5f5;border-radius:12px;padding:11px 14px;margin-bottom:15px;font-size:14px;color:#944e5a;font-weight:800}
.quick-deduct{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick-deduct .btn{background:#fbe5e6;color:#994954;border:1px solid #efcfd2}
.quick-deduct .btn:hover:not(:disabled){background:#f8d6d9}
.deduct-note{margin:9px 0 0;color:#8b6571;font-size:12px}
/* V5.3 紙本存摺開帳，保留既有教師/學生操作畫面 */
.opening-table-wrap{max-height:520px;overflow:auto;border:1px solid #e8edf4;border-radius:14px}
.opening-table{width:100%;border-collapse:collapse;min-width:640px}
.opening-table th,.opening-table td{padding:10px 12px;border-bottom:1px solid #e9edf5;text-align:left;font-size:13px}
.opening-table th{background:#f3f7ff;color:#607393;position:sticky;top:0;z-index:1}
.opening-table input{width:155px;max-width:100%;background:#fff;border:1px solid #d5deeb;padding:9px 11px;border-radius:10px}
.opening-table tbody tr:hover{background:#f8fbfe}
.opening-preview{margin-top:14px;border-radius:15px;background:#f2f8f5;border:1px solid #d2e9da;padding:16px}
.opening-preview .change-list{max-height:230px;overflow:auto;margin:12px 0;background:#fff;border:1px solid #e5ede7;border-radius:10px;padding:10px 14px}
.opening-import{width:100%;min-height:100px;border:1px solid #d8e3f0;border-radius:11px;padding:11px;font-family:inherit}
.opening-alert{background:#fff6e7;border:1px solid #efd6a6;color:#7c5e30;padding:12px 14px;border-radius:11px;font-size:13px;margin-top:12px}
.opening-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){.opening-table{min-width:550px}.opening-table th,.opening-table td{padding:8px}}
/* V6.3 教師指定學生密碼 */
.password-create{margin:12px 0 9px;padding:14px;background:#f6f9ff;border:1px solid #dce8f7;border-radius:13px}
.password-create label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.password-create input{flex:1;min-width:155px;max-width:350px;border:1px solid #d5dfed;border-radius:10px;padding:10px 12px}
.password-create .pass-guide{margin:7px 0 0;color:#6d7d96;font-size:12px}
.password-batch{margin-top:15px;border:1px solid #e2e8f4;border-radius:12px;padding:12px;background:#fff}
.password-batch summary{cursor:pointer;font-weight:800}
.password-batch textarea{width:100%;min-height:122px;resize:vertical;padding:10px 12px;border:1px solid #d8e2ef;border-radius:10px;line-height:1.7;font:inherit;font-size:13px;margin:9px 0}
.password-create .formrow{gap:9px}

/* V6.4：多選學生、日期扣分、密碼顯示 */
.show-password-toggle{display:flex!important;align-items:center;gap:7px;margin:1px 0 14px;font-size:13px;color:#52627e;font-weight:650;cursor:pointer}
.show-password-toggle[hidden]{display:none!important}
.show-password-toggle input{width:17px;height:17px;accent-color:#596f9d;cursor:pointer}
.penalty-date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:13px 0 8px}
.penalty-date-row label{display:flex;align-items:center;gap:8px;font-weight:700}
.penalty-date-row input{padding:9px 11px;border-radius:11px;border:1px solid #d5dfed;background:white;max-width:200px}
.penalty-roster{margin:14px 0;border:1px solid #e0e8f6;background:#f8faff;border-radius:13px;padding:12px}
.penalty-roster summary{cursor:pointer;font-weight:800;color:#3d547f}
.penalty-roster-actions{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}
.penalty-student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;max-height:200px;overflow-y:auto;padding-right:4px}
.penalty-student{display:flex;align-items:center;gap:7px;padding:7px 9px;background:#fff;border:1px solid #e3eaf5;border-radius:10px;cursor:pointer;font-size:13px}
.penalty-student:has(input:checked){background:#eaf2ff;border-color:#94afe1}
.penalty-student input{accent-color:#596f9d;width:17px;height:17px;flex:none}
.penalty-preview-list{max-height:160px;overflow-y:auto;margin-top:7px}
.penalty-preview-list div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e8ecf4;padding:4px 0}
.penalty-preview-list .skip{color:#a54d58}
@media(max-width:600px){.penalty-student-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.penalty-date-row input{max-width:170px}}
</style>

['r1','再睡五分鐘卡',2500,'班導課的上課開始或結束時使用'],['r2','能量補充卡',2500,'向老師兌換小點心'],['r3','點歌大師卡',2500,'午飯時間指定播放音樂'],['r4','請讓我下課卡',3000,'當天訂正延至隔天完成'],['r5','快速通關卡',3000,'午餐或改作業免排隊一天'],['r6','午休自由卡',3000,'午休可安靜自由活動'],['r7','自由穿搭卡',3000,'可依班級規定自由穿搭一次'],['r8','我要看動漫卡',3000,'午飯時間選擇適齡動畫'],['r9','一日特別座位卡',4000,'自行選擇一日座位'],['r10','3C 特權卡',5000,'指定下課時間於老師附近使用平板'],['r11','文具許願卡',5000,'許願一項約 50–100 元文具'],['r12','點數乘骰子倍卡',5000,'須由老師依原規則手動結算'],['r13','遲交特權卡',5000,'一項當日作業隔日繳交'],['r14','犧牲小我、完成大我卡',5000,'兌換加班分 10 分'],['r15','免打掃工作卡',6000,'依班級安排免打掃一天'],['r16','零食吃到飽卡',6000,'下課時間依班規享用零食'],['r17','懲罰但可下課卡',7000,'依老師判斷及班規使用'],['r18','作業減半卡',8000,'一項作業量減半；作文除外'],['r19','我想喝飲料卡',8000,'老師請喝約 50–80 元飲料'],['r20','位置自由選卡',9000,'下次換位時優先選座位'],['r21','分數升級卡',10000,'依老師及學校評量規定審核'],['r22','老師救救我卡',10000,'依評量規範與老師審核'],['r23','作業消失卡',10000,'一項作業免寫；作文除外'],['r24','手機自由卡',15000,'須先符合學校行動載具規範'],['r25','免死金牌卡',20000,'限於符合校規及教師判斷的情況'] ];
const QUICK=[['+1000','參賽獎金',1000],['+500','全勤獎金',500],['+100','職務加給／公開表揚',100],['+50','加班費／幫忙',50],['−100','一般手動扣分（不累計）',-100]];
const PENALTIES=[

{id:"missing",name:"作業缺交",base:100,repeat:true,detail:true,custom:false},

{id:"swear",name:"罵髒話",base:1000,repeat:true,detail:false,custom:false},

{id:"clean",name:"打掃工作未做確實",base:100,repeat:true,detail:false,custom:false},
{id:"snack-break",name:"離開座位／不對的下課時間吃東西",base:100,repeat:true,detail:false,custom:false},
{id:"snack-class",name:"上課時間未經允許吃東西",base:1000,repeat:true,detail:false,custom:false},
{id:"chair",name:"坐兩腳椅",base:500,repeat:true,detail:false,custom:false},
{id:"queue",name:"超車／拖隊／並排",base:100,repeat:true,detail:false,custom:false},
{id:"leave",name:"放學未給小衛生檢查就離開",base:100,repeat:true,detail:false,custom:false},
{id:"helper",name:"小衛生自己跑掉",base:100,repeat:true,detail:false,custom:false},
{id:"talkback",name:"對老師不禮貌地回嘴",base:150,repeat:true,detail:false,custom:false},
{id:"classrule",name:"違反班規",base:100,repeat:true,detail:false,custom:true},
{id:"schoolrule",name:"違反校規",base:100,repeat:true,detail:false,custom:true}
];
const CLASS_QUICK=[['科任老師簽名',1],['整隊表現',2],['打掃確實',2],['被其他老師稱讚',5],['班級共同目標',10],['班際競賽第三名',10],['班際競賽第二名',20],['班際競賽第一名',30]];
const svgEscape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('zh-TW');
const stamp=()=>new Date().toISOString();
const dtime=s=>new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function taipeiDate(value){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value)).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));return `${parts.year}-${parts.month}-${parts.day}`;}
const localDate=()=>taipeiDate(new Date());
function isValidDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;const d=new Date(v+'T00:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===v;}
function weekForLocalDate(v){if(!isValidDate(v))return '';const d=new Date(v+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10);}
function transactionDate(t){if(isValidDate(t.occurredOn))return t.occurredOn;const d=new Date(t.at);if(isNaN(d))return '';return taipeiDate(d);}
const unique=()=>('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));
const studentSeed=(i)=>({id:String(i).padStart(2,'0'),name:`${i}號同學`,balance:0,tickets:[]});
const fresh=()=>({students:Array.from({length:29},(_,i)=>studentSeed(i+1)),tx:[],requests:[],classPoints:0,classHistory:[],classRewards:[],paidWeeks:[],ticketActions:[]});
function normalize(data){
 if(!data||!Array.isArray(data.students)||!Array.isArray(data.tx))return fresh();
 data.requests=Array.isArray(data.requests)?data.requests:[];
 data.classPoints=Number(data.classPoints)||0;
 data.classHistory=Array.isArray(data.classHistory)?data.classHistory:[];
 data.classRewards=Array.isArray(data.classRewards)?data.classRewards:[];
 data.paidWeeks=Array.isArray(data.paidWeeks)?data.paidWeeks:[];
 data.ticketActions=Array.isArray(data.ticketActions)?data.ticketActions:[];
 for(const s of data.students){
   if(!Array.isArray(s.tickets))s.tickets=[];
   for(const t of s.tickets){t.used=!!t.used;t.useRequested=!!t.useRequested;if(!t.used)t.usedAt=null}
   s.balance=Number(s.balance)||0;
 }
 return data;
}
function load(){try{const a=JSON.parse(localStorage.getItem(KEY));if(a&&Array.isArray(a.students)&&Array.isArray(a.tx))return normalize(a)}catch(e){}return fresh()}
let session='locked', cloudRequests=[], generatedAccounts=[], authRole='student', cloudBusy=false, accountNotice=null, pendingAccountRecovery=null, cloudDataReady=false;
let S=load(), tab='bank', mode='teacher', chosen=S.students[0]?.id||'01', rewardSearch='', wardrobeFilter='all', payrollWeekOffset=0, cardFilter='unused', selectedPenalty='late', selectedPenaltyDetail='', selectedPenaltyBase=100, selectedPenaltyDate=localDate(), selectedPenaltyStudents=new Set([chosen]);
let openingDraft={}, openingPreview=null;
function save(){
 if(session==='cloud-teacher'){
   if(!cloudDataReady){notify('雲端班級資料尚未載入，請避免修改，稍後重試');return;}
   if(!window.DongmenCloud){notify('雲端尚未連線，本次修改沒有儲存');return;}
   window.DongmenCloud.saveTeacher(JSON.parse(JSON.stringify(S))).catch(e=>notify('雲端寫入失敗：'+e.message));return;
 }
 if(session!=='demo-teacher'&&session!=='demo-student')return;
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('本機儲存失敗，請先下載備份。')}
}
function student(id=chosen){return S.students.find(s=>s.id===id)||S.students[0]}
function notify(msg){const e=document.querySelector('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.classList.remove('show'),2400)}
function applyCoin(id,amount,reason,kind='adjust'){const s=student(id);if(!s)return false;amount=Number(amount);if(!Number.isInteger(amount)||!amount)return false;s.balance+=amount;S.tx.unshift({id:unique(),studentId:id,amount,reason:String(reason||'點數調整'),kind,at:stamp(),undone:false});save();render();return true}
function weekOf(at){
 const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'});
 const parts=Object.fromEntries(fmt.formatToParts(new Date(at)).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
 const d=new Date(Date.UTC(+parts.year,+parts.month-1,+parts.day));
 d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);
 return d.toISOString().slice(0,10);
}
function currentWeek(){return weekOf(new Date())}
function weekShift(offset=0){const d=new Date(currentWeek()+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-7*Number(offset||0));return d.toISOString().slice(0,10)}
function payrollWeek(){return weekShift(payrollWeekOffset)}
function weekLabel(offset){const mon=weekShift(offset);const d=new Date(mon+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+6);return `${offset===0?'本週':offset===1?'上週':`前${offset}週`}（${mon.slice(5).replace('-','/')}～${d.toISOString().slice(5,10).replace('-','/')}）`}

function hasPayroll(id,week=currentWeek()){
 return S.tx.some(t=>t.studentId===id&&t.kind==='payroll'&&!t.undone&&(t.week||weekOf(t.at))===week);
}
function issuePayroll(onlyStudentId=null){
 if(mode!=='teacher')return;
 const week=payrollWeek();
 const unpaid=S.students.filter(s=>(!onlyStudentId||s.id===onlyStudentId)&&!hasPayroll(s.id,week));
 if(!unpaid.length){notify('此週已發過週薪，請切換週別；如誤發可從紀錄撤銷');return}
 for(const s of unpaid){
   s.balance+=1000;
   S.tx.unshift({id:unique(),studentId:s.id,amount:1000,reason:`每週基本薪資（${week} 當週）`,kind:'payroll',week,at:stamp(),undone:false});
 }
 const msg=`✅ 已入帳：${unpaid.length} 位學生，每人 +1,000 班幣；週別 ${week}`;
 save();render();notify(msg);
 const result=document.querySelector('#payrollResult');if(result)result.textContent=msg;
}
function penaltyKey(p,detail){return p.id+(p.detail?'｜'+detail.trim().toLowerCase():'')}
function penaltyCount(studentId,key){return S.tx.filter(t=>t.kind==='penalty'&&!t.undone&&t.studentId===studentId&&t.penaltyKey===key).length}
function lateEntries(studentId,week){return S.tx.filter(t=>t.kind==='penalty'&&!t.undone&&t.studentId===studentId&&t.penaltyId==='late'&&weekForLocalDate(transactionDate(t))===week)}
function hasLateOnDate(studentId,date){return S.tx.some(t=>t.kind==='penalty'&&!t.undone&&t.studentId===studentId&&t.penaltyId==='late'&&transactionDate(t)===date)}
function penaltyTimes(p,id,date,key){
 if(!p.weekly)return p.repeat?penaltyCount(id,key)+1:1;
 return lateEntries(id,weekForLocalDate(date)).filter(t=>transactionDate(t)<=date).length+1;
}
function recalculatePenaltyChain(studentId,key,period=null){
 const st=student(studentId);
 const p=PENALTIES.find(x=>key===x.id||key.startsWith(x.id+'｜'));
 if(!st||!p)return;
 const entries=S.tx.filter(t=>t.kind==='penalty'&&!t.undone&&t.studentId===studentId&&t.penaltyKey===key&&(!p.weekly||weekForLocalDate(transactionDate(t))===period));
 entries.sort((a,b)=>p.weekly?(transactionDate(a).localeCompare(transactionDate(b))||String(a.at).localeCompare(String(b.at))||String(a.id).localeCompare(String(b.id))):(String(a.at).localeCompare(String(b.at))||String(a.id).localeCompare(String(b.id))));
 entries.forEach((t,i)=>{
   const rank=p.repeat?i+1:1,desired=-(Math.abs(t.penaltyBase||p.base)*rank);
   if(t.amount!==desired){
     const diff=desired-t.amount;
     st.balance+=diff;
     S.tx.unshift({id:unique(),studentId,amount:diff,kind:'recalc',reason:`重算：${t.penaltyName||p.name} 第${rank}次`,at:stamp(),refId:t.id,undone:false});
     t.amount=desired;
   }
   t.penaltyLevel=rank;
   if(p.weekly)t.penaltyWeek=period;
   t.reason=(t.penaltyName||p.name)+(p.weekly?`（${transactionDate(t)}・當週第${rank}次 ×${rank}）`:p.repeat?`（第${rank}次 ×${rank}）`:'');
 });
}
function penaltyTargets(){return S.students.filter(st=>selectedPenaltyStudents.has(st.id));}
function addPenalty(){
 if(mode!=='teacher')return;
 if(session==='cloud-teacher'&&!cloudDataReady)return notify('雲端資料載入中，請稍後再操作');
 const p=PENALTIES.find(x=>x.id===document.querySelector('#penaltyType')?.value);
 if(!p)return;
 const raw=document.querySelector('#penaltyDetail')?.value.trim()||'';
 if(p.detail&&!raw)return notify('請填寫具體作業／物品名稱');
 const rawBase=document.querySelector('#penaltyBase')?.value;
 const base=p.custom?Number(rawBase):p.base;
 if(!Number.isInteger(base)||base<50||base>1000)return notify('班規／校規基本扣分限 50～1,000');
 const date=document.querySelector('#penaltyDate')?.value||'';
 if(!isValidDate(date)||date>localDate())return notify('請選擇正確、且不晚於今天的登記日期');
 const targets=penaltyTargets();if(!targets.length)return notify('請先勾選至少一位學生');
 const key=penaltyKey(p,raw),label=p.name+(raw?'：'+raw:''),at=stamp(),groupId=unique();
 let done=0,skipped=[];
 for(const st of targets){
   if(p.weekly&&hasLateOnDate(st.id,date)){skipped.push(st.id+' 號');continue;}
   const times=penaltyTimes(p,st.id,date,key);
   const amount=-(base*(p.weekly?1:times));
   st.balance+=amount;
   S.tx.unshift({id:unique(),studentId:st.id,amount,reason:label+(p.weekly?`（${date}・當週第${times}次 ×${times}）`:p.repeat?`（第${times}次 ×${times}）`:''),kind:'penalty',penaltyKey:key,penaltyId:p.id,penaltyName:label,penaltyBase:base,penaltyLevel:p.weekly?1:times,penaltyWeek:p.weekly?weekForLocalDate(date):undefined,occurredOn:date,groupId,at,undone:false});
   if(p.weekly)recalculatePenaltyChain(st.id,key,weekForLocalDate(date));
   done++;
 }
 if(!done)return notify(`沒有新增紀錄：${skipped.join('、')}當天已登記遲到`);
 save();render();notify(`已登記 ${done} 位學生（${date}）${skipped.length?'；略過重複 '+skipped.join('、'):''}`);
}
function updatePenaltyPreview(){
 const p=PENALTIES.find(x=>x.id===document.querySelector('#penaltyType')?.value),out=document.querySelector('#penaltyPreview');
 if(!out||!p)return;
 if(p.id!==selectedPenalty){selectedPenalty=p.id;selectedPenaltyDetail='';const old=document.querySelector('#penaltyDetail');if(old)old.value='';}
 const detailEl=document.querySelector('#penaltyDetail'),baseEl=document.querySelector('#penaltyBase');
 if(detailEl){detailEl.closest('.penaltydetail').style.display=p.detail?'':'none';detailEl.required=p.detail}
 if(baseEl){baseEl.closest('.penaltybase').style.display=p.custom?'':'none';if(!p.custom)baseEl.value=String(p.base)}
 const detail=detailEl?.value.trim()||'';selectedPenaltyDetail=detail;
 const base=p.custom?Number(baseEl?.value):p.base;
 if(p.custom&&Number.isInteger(base))selectedPenaltyBase=base;
 const date=document.querySelector('#penaltyDate')?.value||selectedPenaltyDate;
 const targets=penaltyTargets(),key=penaltyKey(p,detail);
 const summary=document.querySelector('#penaltyStudentCount');if(summary)summary.textContent=`已選 ${targets.length} 位`;
 const valid=isValidDate(date)&&date<=localDate();
 const previews=valid&&Number.isInteger(base)?targets.map(st=>({st,skip:p.weekly&&hasLateOnDate(st.id,date),times:penaltyTimes(p,st.id,date,key),later:p.weekly?lateEntries(st.id,weekForLocalDate(date)).filter(t=>transactionDate(t)>date).length:0})):[];
 const total=previews.filter(x=>!x.skip).reduce((acc,x)=>acc+base*(x.times+x.later),0);
 out.innerHTML=`<b>${p.weekly?'週一至週日各自累計':p.repeat?'同項目持續累計':'固定金額'}</b>｜${valid?svgEscape(date):'請選擇有效日期'}｜已選 <b>${targets.length}</b> 位｜${p.weekly?'含後續重算，合計影響':'預計扣'} <b class="neg">${money(total)}</b> 班幣${p.detail&&!detail?'<div class="softnote">請填寫作業／物品名稱。</div>':''}${previews.length?`<div class="penalty-preview-list">${previews.map(x=>`<div class="${x.skip?'skip':''}"><span>${svgEscape(x.st.id)} 號 ${svgEscape(x.st.name)}${x.skip?'（當天已登記）':p.repeat?`（第${x.times}次）`:''}</span><b>${x.skip?'略過':'−'+money(base*(x.times+x.later))+(x.later?'（含後續重算）':'')}</b></div>`).join('')}</div>`:''}`;
}
function undo(id){
 if(mode!=='teacher')return;
 const t=S.tx.find(x=>x.id===id);
 if(!t||t.undone||!['adjust','payroll','penalty'].includes(t.kind))return notify('這筆紀錄無法撤銷');
 const st=student(t.studentId);
 t.undone=true;

 const setCount=S.students.filter(s=>Number.isSafeInteger(s.openingBalance)).length;
 const rows=S.students.map(s=>{
   const value=Object.prototype.hasOwnProperty.call(openingDraft,s.id)?openingDraft[s.id]:'';
   const opening=Number.isSafeInteger(s.openingBalance)?money(s.openingBalance):'尚未設定';
   return `<tr><td>${svgEscape(s.id)}</td><td><b>${svgEscape(s.name)}</b></td><td class="tally">${money(s.balance)}</td><td>${opening}</td><td><input class="opening-input" data-student="${svgEscape(s.id)}" type="number" min="-100000000" max="100000000" step="1" inputmode="numeric" placeholder="紙本結餘" value="${svgEscape(value)}" aria-label="${svgEscape(s.name)}紙本餘額" /></td></tr>`;
 }).join('');
 const preview=openingPreview?openingPreviewHtml():'';
 return `<div class="panel"><div class="sectiontitle"><div><h2>📥 紙本存摺 → 初始班幣</h2><span>輸入紙本餘額</span></div><span class="chip">已設定 ${setCount} / ${S.students.length} 人</span></div>
 
 <div class="opening-alert">初次設定會對齊紙本餘額；後續更正只調整差額，保留線上紀錄。</div>
 <div class="line"></div><div class="subhead">✍️ 個別填寫（可一次設定全班）</div>
 <div class="opening-table-wrap"><table class="opening-table"><thead><tr><th>座號</th><th>學生</th><th>目前系統餘額</th><th>已設定起始額</th><th>要輸入的紙本餘額</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="line"></div><div class="subhead">📋 批次貼上（選用）</div><p class="intro">格式：<code>1,3500</code>（座號,餘額）。</p>
 <textarea id="openingPaste" class="opening-import" placeholder="1,3500&#10;2,6200&#10;3,-200"></textarea>
 <div class="opening-actions" style="margin-top:10px"><button type="button" class="btn secondary" data-action="openingPaste">把貼上的點數填入表格</button><button type="button" class="btn" data-action="openingCheck">🔎 預覽要匯入的點數</button><button type="button" class="btn ghost" data-action="openingClear">清除未送出的輸入</button></div>
 <div id="openingFeedback" class="softnote" role="status">先預覽，再確認匯入。</div>
 ${preview}</div>`;
}
function previewOpeningRows(){
 const items=[];
 for(const s of S.students){
   if(!Object.prototype.hasOwnProperty.call(openingDraft,s.id))continue;
   const text=String(openingDraft[s.id]).trim();
   if(!text)continue;
   if(!/^-?\d+$/.test(text))throw Error(`${s.id} 號 ${s.name}：請輸入整數點數`);
   const target=Number(text);
   if(!Number.isSafeInteger(target)||Math.abs(target)>100000000)throw Error(`${s.id} 號 ${s.name}：金額超出限制（±1 億）`);
   const previouslySet=Number.isSafeInteger(s.openingBalance);
   const delta=previouslySet?target-s.openingBalance:target-s.balance;
   const priorDigital=!previouslySet&&S.tx.some(t=>t.studentId===s.id);
   items.push({id:s.id,name:s.name,target,delta,after:s.balance+delta,before:s.balance,previouslySet,priorDigital});
 }
 return items;
}
function openingPreviewHtml(){
 if(!openingPreview)return '';
 const pending=openingPreview.filter(x=>!x.previouslySet||x.delta!==0);
 const warning=openingPreview.filter(x=>x.priorDigital).length;
 return `<div class="opening-preview"><div class="subhead">🔎 匯入前預覽：${openingPreview.length} 位已填寫、${pending.length} 位需要新增或修改</div>
 ${warning?`<div class="opening-alert"><b>注意：</b>其中 ${warning} 位學生已有數位交易，且尚未設定起始金額。首次匯入會把目前餘額改成輸入值；若這些線上紀錄必須另外加計，請先核對後再匯入。</div>`:''}
 <div class="change-list">${openingPreview.map(x=>`<div class="historyitem"><div><b>${svgEscape(x.id)}｜${svgEscape(x.name)}</b><div class="small">${x.previouslySet?'更正原本起始額':'首次紙本開帳'}：${money(x.target)} 班幣</div></div><div class="tally">${money(x.before)} → <b>${money(x.after)}</b> <span class="${x.delta>=0?'pos':'neg'}">(${x.delta>0?'+':''}${money(x.delta)})</span></div></div>`).join('')}</div>
 <div class="opening-actions"><button type="button" class="btn mint" data-action="openingApply">✅ 確認匯入 ${pending.length} 位</button><button type="button" class="btn ghost" data-action="openingCancel">返回修改</button></div>
 <p class="softnote">匯入時寫入「紙本起始額」操作紀錄；重複填入同一金額不會再加一次。請先下載 JSON 備份以保留原資料。</p></div>`;
}
function readOpeningInputs(){
 document.querySelectorAll('.opening-input').forEach(e=>openingDraft[e.dataset.student]=e.value);
}
function setOpeningPreview(){
 try{
   readOpeningInputs();const next=previewOpeningRows();
   if(!next.length)return notify('請至少填寫一位學生的紙本餘額');
   openingPreview=next;render();notify(`已產生 ${next.length} 位學生的匯入預覽，尚未寫入`);
 }catch(err){openingPreview=null;notify(err.message)}
}
function fillOpeningPaste(){
 const raw=document.querySelector('#openingPaste')?.value.trim();if(!raw)return notify('請先貼上座號與紙本點數');
 const next={},lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(lines.length>80)return notify('最多一次貼入 80 行');
 for(let i=0;i<lines.length;i++){
   const parts=lines[i].split(/[,，\t]/).map(x=>x.trim());
   if(parts.length<2||parts.length>3){notify(`第 ${i+1} 行格式錯誤，請使用「座號,點數」`);return}
   const seat=parts[0],val=parts[parts.length-1];
   if(!/^\d+$/.test(seat)||! /^-?\d+$/.test(val)){notify(`第 ${i+1} 行必須是座號與整數點數`);return}
   const id=String(Number(seat)).padStart(2,'0');
   if(!S.students.some(s=>s.id===id)){notify(`找不到 ${seat} 號學生，請先確認匯入名單`);return}
   if(Object.prototype.hasOwnProperty.call(next,id)){notify(`第 ${i+1} 行座號 ${seat} 重複`);return}
   if(!Number.isSafeInteger(Number(val))||Math.abs(Number(val))>100000000){notify(`第 ${i+1} 行金額超出限制`);return}
   next[id]=val;
 }
 Object.assign(openingDraft,next);openingPreview=null;render();notify(`已填入 ${Object.keys(next).length} 位學生的紙本餘額，請按「預覽」`);
}
function applyOpeningPreview(){
 if(mode!=='teacher'||!openingPreview?.length)return notify('請先預覽要匯入的點數');
 let latest;try{readOpeningInputs();latest=previewOpeningRows()}catch(err){return notify(err.message)}
 if(JSON.stringify(latest)!==JSON.stringify(openingPreview)){openingPreview=null;render();return notify('輸入內容或餘額已變更，請重新預覽再確認')}
 const at=stamp(), changed=openingPreview.filter(x=>!x.previouslySet||x.delta!==0);
 for(const item of changed){
   const s=student(item.id);
   s.balance+=item.delta;
   s.openingBalance=item.target;
   s.openingBalanceAt=at;
   S.tx.unshift({id:unique(),studentId:s.id,amount:item.delta,reason:`${item.previouslySet?'更正紙本起始額':'紙本存摺開帳'}：${money(item.target)} 班幣`,kind:'opening',openingBalance:item.target,at,undone:false});
 }
 openingDraft={};openingPreview=null;
 if(changed.length){save();render();notify(`✅ 已設定 ${changed.length} 位學生的紙本起始額`)}
 else{render();notify('輸入金額與原本相同，未重複記點')}
}
function settings(){if(mode!=='teacher')return bank();return `<div class="panel settings"><div class="sectiontitle"><div><h2>⚙️ 名單與備份</h2></div></div><details class="account-advanced"><summary>清空測試資料（慎用）</summary><p class="intro">此操作會清除班幣、紀錄與學生綁定；保留姓名和座號，不會刪除 Firebase 登入帳號。</p><div class="row" style="margin-bottom:15px"><button class="btn red" data-action="resetCloudClass">清空測試班幣與學生綁定（保留名單）</button></div></details><div class="line"></div><div class="subhead">匯入正式名單</div><p class="intro">每行「座號,姓名」。<b>重新匯入會清空班幣、卡片及學生綁定。</b></p><textarea id="namesInput" aria-label="學生名單" placeholder="1,學生甲\n2,學生乙\n3,學生丙"></textarea><div class="row" style="margin-top:12px"><button class="btn" data-action="importNames">匯入名單並重新開始</button><button class="btn secondary" data-action="fillNames">填入目前名單</button></div><div class="line"></div><div class="subhead">班級資料備份</div><div class="row"><button class="btn mint" data-action="export">⬇️ 下載全班紀錄備份</button><button class="btn secondary" data-action="restore">📂 還原備份</button><button class="btn red" data-action="reset">重設所有示範資料</button></div><input type="file" id="backupFile" accept=".json,application/json" style="display:none"/></div>`}

function importNames(){if(session==='cloud-teacher'&&S.students.some(s=>s.authUid)&&prompt('重新匯入會撤銷全部現有學生登入帳號，請輸入「確認重建」才可繼續')!=='確認重建')return;const raw=document.querySelector('#namesInput').value.trim();if(!raw)return alert('請先貼上學生名單');const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length>60)return alert('一次最多匯入 60 位學生');const next=[],ids=new Set();for(let i=0;i<lines.length;i++){let input=lines[i].split(/[,，\t]/);let id,name;if(input.length>1&&/^\d+$/.test(input[0].trim())){id=String(Number(input[0].trim())).padStart(2,'0');name=input.slice(1).join(' ').trim()}else{id=String(i+1).padStart(2,'0');name=lines[i]}if(!name||ids.has(id))return alert('請確認每行都有姓名，且座號不能重複。');ids.add(id);const s=studentSeed(Number(id)||i+1);s.id=id;s.name=name.slice(0,40);s.balance=0;next.push(s)}if(!confirm(`要匯入 ${next.length} 位學生嗎？\n這會清空目前所有點數、兌換及班分紀錄。`))return;S={...fresh(),students:next};openingDraft={};openingPreview=null;chosen=next[0].id;selectedPenaltyStudents=new Set([chosen]);save();tab='bank';render();notify('學生名單匯入完成，班幣從 0 開始')}
function exportBackup(){const blob=new Blob([JSON.stringify({version:6,exportedAt:stamp(),data:S},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`東門班幣備份_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('已開始下載備份')}
async function restoreBackup(file){try{const raw=JSON.parse(await file.text()),data=raw.data||raw;if(!Array.isArray(data.students)||!Array.isArray(data.tx)||!Array.isArray(data.requests)||typeof data.classPoints!=='number')throw Error('備份格式錯誤');if(!confirm('確定用這份備份覆蓋目前瀏覽器內的所有紀錄嗎？'))return;S=normalize(data);openingDraft={};openingPreview=null;chosen=S.students[0]?.id;save();tab='bank';render();notify('已還原備份')}catch(e){alert('無法還原：'+e.message)}}
function undoClass(id){const t=S.classHistory.find(x=>x.id===id);if(mode!=='teacher'||!t||t.undone||t.kind==='undo')return;if(S.classPoints-t.amount<0)return notify('已有點數使用紀錄，撤銷這筆會使班分低於零；請先處理後續兌換');if(!confirm(`撤銷全班班分「${t.reason}」${t.amount>0?'+':''}${t.amount} 點？`))return;t.undone=true;S.classPoints-=t.amount;S.classHistory.unshift({id:unique(),amount:-t.amount,reason:'撤銷：'+t.reason,kind:'undo',at:stamp(),refId:t.id});save();render();notify('班分已撤銷')}
function addClass(amount,reason){amount=Number(amount);if(!Number.isInteger(amount)||!amount)return;const next=S.classPoints+amount;if(next<0){notify('全班班分不能低於 0');return}S.classPoints=next;S.classHistory.unshift({id:unique(),amount,reason,at:stamp()});save();render();notify(`全班班分 ${amount>0?'+':''}${amount}`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,val=b.dataset.value;

Class(-500,'兌換全班獎勵：'+r)}else if(action==='openingPaste'&&mode==='teacher'){fillOpeningPaste()}
 else if(action==='openingCheck'&&mode==='teacher'){setOpeningPreview()}
 else if(action==='openingApply'&&mode==='teacher'){applyOpeningPreview()}
 else if(action==='openingCancel'&&mode==='teacher'){openingPreview=null;render()}
 else if(action==='openingClear'&&mode==='teacher'){openingDraft={};openingPreview=null;render();notify('已清除未送出的輸入')}

async function cloudApprove(id){
 const req=cloudRequests.find(r=>r.id===id&&r.status==='pending');if(!req)return notify('找不到待審核申請');
 const st=S.students.find(x=>x.id===req.studentId);if(!st)return notify('學生不存在');
 // 記錄已處理申請，避免雲端狀態確認失敗後再次扣點或再次核銷。
 S.processedRequestIds=Array.isArray(S.processedRequestIds)?S.processedRequestIds:[];
 if(!S.processedRequestIds.includes(id)){
   if(req.kind==='redeem'){
     const reward=REWARDS.find(r=>r[0]===req.rewardId);
     if(!reward||st.balance<reward[2])return notify('班幣不足或卡片不存在，請先拒絕申請');
     st.balance-=reward[2];st.tickets.unshift({id:unique(),rewardId:req.rewardId,used:false,at:stamp()});
     S.tx.unshift({id:unique(),studentId:st.id,amount:-reward[2],reason:'兌換：'+reward[1],kind:'reward',at:stamp()});
   }else if(req.kind==='use'){
     const t=st.tickets.find(t=>t.id===req.ticketId);if(!t||t.used)return notify('這張卡不存在或已使用，請拒絕申請');
     t.used=true;t.usedAt=stamp();t.useRequested=false;t.requestedAt=null;auditTicket(t.id,st.id,'老師確認使用');
   }else return;
   S.processedRequestIds.push(id);
   save();render();
 }
 try{await window.DongmenCloud.whenSaved();await window.DongmenCloud.resolveRequest(id,'approved');notify(`${st.name} 的申請已核准`)}catch(e){notify('確認同步未完成：'+e.message)}
}

}

// 密碼由教師指定，只暫存在瀏覽器記憶體，不寫入班級存摺資料庫。
function validateAssignedPassword(raw){
 const pass=String(raw??'');
 if(pass.length<8||pass.length>30)throw Error('指定密碼需為 8～30 碼');
 if(!/^[\x21-\x7E]+$/.test(pass))throw Error('密碼請使用英文字母、數字或英文符號，不能包含空白或全形字元');
 return pass;
}
function parseBatchPasswords(raw,missing){
 const values=new Map(),seenPasswords=new Set();
 const lines=String(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!lines.length)throw Error('請先從 Excel 貼上「座號、密碼」，每位學生一行');
 for(let index=0;index<lines.length;index++){
  const line=lines[index],separator=line.includes('\t')?'\t':(line.includes('，')?'，':',');
  const cut=line.indexOf(separator);
  if(cut<0)throw Error(`第 ${index+1} 行格式錯誤，應為「座號,密碼」`);
  const rawId=line.slice(0,cut).trim(),rawPassword=line.slice(cut+1).trim();
  if(index===0&&/^座號$/.test(rawId)&&/^密碼$/.test(rawPassword))continue;
  if(!/^\d{1,3}$/.test(rawId))throw Error(`第 ${index+1} 行座號格式錯誤`);
  const id=String(Number(rawId)).padStart(2,'0');
  const pass=validateAssignedPassword(rawPassword);
  if(values.has(id))throw Error(`${id} 號重複輸入，請保留一筆`);
  if(seenPasswords.has(pass.toLowerCase()))throw Error(`有兩位以上學生使用同一組密碼（第 ${index+1} 行），請設定不同密碼`);
  values.set(id,pass);seenPasswords.add(pass.toLowerCase());
 }
 const allowed=new Set(missing.map(s=>s.id));
 const unknown=[...values.keys()].filter(id=>!allowed.has(id));
 if(unknown.length)throw Error(`${unknown.join('、')} 號不在「尚未建立帳號」名單內，請移除後重試`);
 const omitted=missing.filter(st=>!values.has(st.id)).map(st=>st.id);
 if(omitted.length)throw Error(`尚未設定密碼的座號：${omitted.join('、')}`);
 if(generatedAccounts.some(a=>seenPasswords.has(a.password.toLowerCase())))throw Error('指定密碼與本次已建立學生的密碼重複，請修改');
 return values;
}
async function createAccountFor(s,assignedPassword){
 const customPassword=validateAssignedPassword(assignedPassword);
 if(generatedAccounts.some(x=>x.password.toLowerCase()===customPassword.toLowerCase()))throw Error('這組密碼與本次建立的其他學生相同，請換一組');
 if(session!=='cloud-teacher'||!cloudDataReady)throw Error('教師後台資料尚未載入完成');
 const studentId=s.id;
 if(S.students.find(x=>x.id===studentId)?.authUid)throw Error('學生已有帳號，請使用修復綁定');
 // One Firebase Auth signup on a separate auth instance; no teacher sign-out.
 let a;
 try{a=await window.DongmenCloud.createStudentAccount(s,customPassword)}catch(err){throw Error(err?.message||'建立 Firebase 帳號失敗')}
 // If saving fails, teacher still has the new credentials and UID to finish binding without a second signup.
 generatedAccounts.push({studentId,studentName:s.name,username:a.username,password:a.password});
 pendingAccountRecovery={studentId,uid:a.uid,username:a.username};
 const current=S.students.find(x=>x.id===studentId);
 if(!current)throw Error('Firebase 帳號已建立，但學生名單已變更。請先下載帳密表再重新對應 UID');
 const backup={authUid:current.authUid||null,loginName:current.loginName||null,accountSeq:Number(current.accountSeq||0)};
 current.authUid=a.uid;current.loginName=a.username;current.accountSeq=backup.accountSeq+1;
 try{
   await window.DongmenCloud.saveTeacher(JSON.parse(JSON.stringify(S)));
   const view=await window.DongmenCloud.checkStudentView(a.uid);
   if(!view||view.student?.id!==studentId)throw Error('Firestore 個人存摺沒有建立成功');
 }catch(err){
   current.authUid=backup.authUid;current.loginName=backup.loginName;current.accountSeq=backup.accountSeq;
   render();throw Error('Firebase 帳號已建立，但存摺同步失敗：'+(err?.message||err)+'。不要重複建立！請下載本次帳密，按「完成剛建立的存摺綁定」重試。');
 }
 pendingAccountRecovery=null;
 render();return a;
}

   if(pendingAccountRecovery)return setAccountNotice('上一位學生的帳號尚未完成存摺綁定。請先完成綁定，避免遺留無法登入的帳號。','error');
   const missing=S.students.filter(s=>!s.authUid);
   if(!missing.length)return setAccountNotice('全班學生已經有存摺綁定，無需重新建立。','success');
   let passwords;
   try{passwords=parseBatchPasswords(document.querySelector('#batchStudentPasswords')?.value,missing)}
   catch(err){return setAccountNotice('批次建立尚未開始：'+err.message,'error')}
   if(!confirm(`已核對 ${missing.length} 位學生皆有不同的指定密碼。\n確定開始建立？完成後請立即下載帳號密碼表。`))return;
   b.disabled=true;let done=0,errorMessage='';
   for(const st of missing){
     setAccountNotice(`正在建立第 ${done+1}／${missing.length} 位（${st.id} 號）……`,'info',st.id);
     try{await createAccountFor(st,passwords.get(st.id));done++}
     catch(err){errorMessage=`${st.id} 號 ${st.name}：${err.message}`;break}
   }
   b.disabled=false;render();
   setAccountNotice(errorMessage?`已完成 ${done} 位，因錯誤中止：${errorMessage}。先下載已完成帳號的密碼表，不要重試整批。`:`已建立 ${done} 個帳號，請立即下載本次帳號密碼表。`,errorMessage?'error':'success');
 }
 if(action==='repairStudentBinding'&&session==='cloud-teacher'){
   if(!cloudDataReady)return setAccountNotice('尚未載入雲端資料，暫時不能綁定帳號','error');
   const st=student();if(!st?.authUid)return notify('這位學生還沒有帳號綁定，請建立帳號或輸入現有 UID');
   b.disabled=true;
   try{
     await window.DongmenCloud.saveTeacher(JSON.parse(JSON.stringify(S)));
     const view=await window.DongmenCloud.checkStudentView(st.authUid);
     if(!view||view.student?.id!==st.id)throw Error('存摺文件未成功建立，請檢查資料庫規則');
     setAccountNotice(`${st.id} 號存摺綁定已修復，學生可以重新登入。`,'success',st.id);
   }catch(err){setAccountNotice('修復失敗：'+err.message,'error',st.id)}finally{b.disabled=false}
 }
 if(action==='bindExistingStudent'&&session==='cloud-teacher'){
   if(!cloudDataReady)return setAccountNotice('尚未載入雲端資料，暫時不能綁定帳號','error');
   const st=student();
   const uid=(document.querySelector('#existingStudentUid')?.value||'').trim();
   const username=(document.querySelector('#existingStudentLogin')?.value||'').trim().toLowerCase();
   if(!/^[A-Za-z0-9_-]{12,128}$/.test(uid))return notify('請輸入 Firebase Authentication 的完整學生 UID');
   if(!(/^[a-z0-9_-]{3,64}$/.test(username)||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username)))return notify('請輸入學生登入帳號，例如 c506s01abcde 或完整電子郵件');
   if(uid===window.DongmenCloud.getTeacherUid())return notify('不能將教師 UID 綁定為學生帳號');
   if(S.students.some(x=>x.id!==st.id&&x.authUid===uid))return notify('這個 UID 已綁定到班上其他學生，請核對座號');
   if(st.authUid&&st.authUid!==uid&&!confirm(`此學生已綁定另一個 UID，確定要改綁到新 UID？舊學生登入會失效。`))return;
   if(!confirm(`請確認資料：\n${st.id} 號 ${st.name}\n登入帳號：${username}\nFirebase UID：${uid}\n\n只會連結帳號，不會改變班幣餘額。`))return;
   b.disabled=true;
   const oldUid=st.authUid||null,oldLogin=st.loginName||null;
   try{
     const existing=await window.DongmenCloud.checkStudentView(uid);
     if(existing?.student?.id&&existing.student.id!==st.id)throw Error('這個 UID 的存摺已屬於另一個座號，請勿覆蓋');
     st.authUid=uid;st.loginName=username;
     await window.DongmenCloud.saveTeacher(JSON.parse(JSON.stringify(S)));
     const view=await window.DongmenCloud.checkStudentView(uid);
     if(!view||view.student?.id!==st.id)throw Error('綁定存摺寫入後未能確認成功');
     if(oldUid&&oldUid!==uid)await window.DongmenCloud.revokeOldView(oldUid);
     render();setAccountNotice(`${st.id} 號帳號已綁定，原有班幣保持不變。`,'success',st.id);
   }catch(err){
     st.authUid=oldUid;st.loginName=oldLogin;
     render();setAccountNotice('綁定失敗：'+err.message,'error',st.id);
   }finally{b.disabled=false}
 }
 if(action==='downloadCredentials')accountCsv();
});
window.DongmenV5={
 cloudReady(ready){document.querySelector('#demoBlock').hidden=!!ready;if(ready)authError('');},
 cloudTeacher(data){cloudDataReady=false;session='cloud-teacher';mode='teacher';setTeacherCloudState(data);setAppVisible('teacher','👩‍🏫 教師管理後台（資料載入中）');},
 cloudStudent(data){session='cloud-student';mode='student';setStudentCloudState(data);setAppVisible('student','🧒 學生個人存摺');},
 updateTeacher(data){cloudDataReady=true;setTeacherCloudState(data);document.querySelector('#authStatus').textContent='👩‍🏫 教師管理後台';},getQrStudents(){return {allowed:session==='cloud-teacher'&&cloudDataReady,classId:String(window.DONGMEN_CLOUD_SETUP?.classId||'506'),selected:chosen,students:S.students.map(s=>({id:s.id,name:s.name,authUid:s.authUid||'',loginName:s.loginName||''}))};},updateStudent:setStudentCloudState,updateRequests:setCloudRequests,authError,logout:showAuth
};
showAuth();

})();
</script>

<script id="dongmen-qr-feature">
(()=>{'use strict';
// 只載入在瀏覽器本機製作 QR 碼的程式庫；不把帳密傳給外部 QR 產生網站。
let qrLoadPromise;
function loadScript(src){return new Promise((resolve,reject)=>{
 const script=document.createElement('script');script.src=src;script.async=true;
 const timer=setTimeout(()=>{script.remove();reject(Error('載入逾時'));},12000);
 script.onload=()=>{clearTimeout(timer);resolve();};script.onerror=()=>{clearTimeout(timer);reject(Error('載入失敗'));};document.head.appendChild(script);
});}
async function ensureQR(){
 if(typeof window.qrcode==='function')return;
 if(!qrLoadPromise)qrLoadPromise=(async()=>{
  try{await loadScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');}
  catch(err){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');}
  if(typeof window.qrcode!=='function')throw Error('QR 產生工具未正確載入');
 })();
 try{await qrLoadPromise}catch(err){qrLoadPromise=null;throw err}
}
function qrUrl(loginName){
 if(location.protocol!=='https:')throw Error('請先開啟 GitHub Pages 正式 HTTPS 網址再列印 QR 卡');
 const url=new URL(location.origin+location.pathname);
 url.searchParams.set('account',loginName);
 return url.href;
}
function makeSVG(url){
 const qr=window.qrcode(0,'M');qr.addData(url,'Byte');qr.make();return qr.createSvgTag(4,4);
}
function escapeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function previewQrCards(onlyOne){
 if(!window.DongmenV5?.getQrStudents)throw Error('教師資料尚未完成載入');
 const info=window.DongmenV5.getQrStudents();
 if(!info?.allowed)throw Error('請使用正式教師帳號登入');
 const rows=onlyOne?info.students.filter(s=>s.id===info.selected):info.students;
 const ready=rows.filter(s=>s.authUid&&s.loginName);
 if(!ready.length)throw Error('目前沒有可列印的學生帳號，請先建立帳號');
 await ensureQR();
 const all=ready.map(s=>{
  const svg=makeSVG(qrUrl(s.loginName));
  return `<article class="qr-card"><div class="qr-art">${svg}</div><div class="qr-card-body"><div class="qr-card-school">東門班級存摺 · ${escapeText(info.classId)} 班 ${escapeText(s.id)} 號</div><div class="qr-card-name">${escapeText(s.name)}</div><div class="qr-card-account">帳號：${escapeText(s.loginName)}</div><div class="qr-card-help">掃 QR Code → 輸入個人密碼</div></div></article>`;
 });
 document.getElementById('qrPrintSheet').innerHTML=all.join('');
 const skipped=rows.length-ready.length;
 document.getElementById('qrPreviewTitle').textContent=`登入卡 ${ready.length} 張`+(skipped?`（${skipped} 位尚未建立帳號，已略過）`:'');
 document.getElementById('qrOverlay').hidden=false;
 document.body.style.overflow='hidden';
}
function closeCards(){document.getElementById('qrOverlay').hidden=true;document.body.style.overflow='';}
document.addEventListener('click',async evt=>{
 const action=evt.target.closest('[data-action]')?.dataset.action;
 if(action!=='qrPrintAll'&&action!=='qrPrintOne')return;
 const button=evt.target.closest('button');if(button?.disabled)return;
 button.disabled=true;
 try{await previewQrCards(action==='qrPrintOne')}
 catch(err){alert('無法產生 QR 登入卡：'+(err?.message||err)+'。\n請確認網路可連接 QR 程式庫，或稍後重試。')}
 finally{button.disabled=false;}
});
document.getElementById('qrPreviewClose').addEventListener('click',closeCards);
document.getElementById('qrPrintNow').addEventListener('click',()=>window.print());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('qrOverlay').hidden)closeCards()});
function fillFromQR(){
 const v=new URLSearchParams(location.search).get('account');
 if(!v)return;
 const username=v.trim();
 if(!/^[a-z0-9_-]{3,64}$/i.test(username)&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username))return;
 document.querySelector('[data-auth-tab="student"]')?.click();
 const input=document.getElementById('loginUsername');if(input)input.value=username;
 const hint=document.getElementById('qrLoginHint');if(hint)hint.hidden=false;
 document.getElementById('loginPassword')?.focus();
 try{const clean=new URL(location.href);clean.searchParams.delete('account');history.replaceState(null,'',clean.pathname+clean.search+clean.hash);}catch(e){}
}
fillFromQR();
})();
</script>

<!-- Firebase 只在真的填好設定後才載入。離線試用不會連結 Firebase CDN。 -->
<script id="dongmen-firebase-source" type="text/plain">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, initializeAuth, inMemoryPersistence, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, doc, collection, getDoc, query, where, onSnapshot, setDoc, updateDoc, deleteDoc, addDoc, serverTimestamp, writeBatch } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const setup=window.DONGMEN_CLOUD_SETUP||{};
const cfg=setup.firebaseConfig||{};
const configured=!!(cfg.apiKey&&cfg.authDomain&&cfg.projectId&&cfg.appId);
let auth,provisionAuth,db,unsubscribeState=()=>{},unsubscribeRequests=()=>{};
const classId=String(setup.classId||'506').replace(/[^a-zA-Z0-9_-]/g,'')||'506';
const code=classId.toLowerCase();
const path=(...p)=>doc(db,'classrooms',classId,...p);
const collectionPath=(...p)=>collection(db,'classrooms',classId,...p);
let writes=Promise.resolve(), pendingWrites=0, signInType='student', knownStudentUids=new Set();
let cloudTeacher=false;
function createStudentView(s,state){
 return {student:{id:s.id,name:s.name,balance:s.balance,tickets:s.tickets||[]},
   tx:(state.tx||[]).filter(t=>t.studentId===s.id).slice(0,250),
   classPoints:state.classPoints||0,updatedAt:serverTimestamp()};
}
function readableError(e){
 const code=e?.code||'';
 if(code==='auth/invalid-credential'||code==='auth/wrong-password'||code==='auth/user-not-found')return Error('帳號或密碼不正確');
 if(code==='auth/email-already-in-use')return Error('Firebase Authentication 已有相同學生帳號（auth/email-already-in-use）。請不要重新建立；到 Firebase → Authentication → Users 找到該帳號並複製 User UID，回教師後台使用「綁定既有帳號」');
 if(code==='auth/invalid-email')return Error('Firebase 拒絕學生帳號格式（auth/invalid-email），請將完整錯誤截圖；不要反覆建立');
 if(code==='auth/weak-password')return Error('Firebase 拒絕這組密碼，請改用更長、含英文字母及數字的密碼（auth/weak-password）');
 if(code==='auth/too-many-requests')return Error('Firebase 暫時限制短時間大量建立帳號（auth/too-many-requests）。請改為逐位建立，不要反覆點擊');
 if(code==='auth/network-request-failed')return Error('Firebase 網路連線失敗（auth/network-request-failed），請檢查學校網路');
 if(code==='auth/app-not-authorized'||code==='auth/unauthorized-domain')return Error('Firebase 尚未授權此 GitHub Pages 網域（'+code+'）');
 if(code==='permission-denied')return Error('Firestore 拒絕寫入（permission-denied）。請確認 teachers/教師UID 的 classId=506、enabled=true，且最新 Firestore 安全規則已發布');
 if(code==='auth/operation-not-allowed')return Error('請到 Firebase Authentication → Sign-in method 啟用電子郵件／密碼登入');
 if(code==='auth/admin-restricted-operation')return Error('Firebase 已限制使用者在網站自行註冊（auth/admin-restricted-operation）。請在 Authentication → Settings → User actions 啟用建立帳號，或改由 Firebase 主控台建立學生帳號再回本頁綁定 UID');
 return e;
}
function startListening(role,user){
 unsubscribeState();unsubscribeRequests();
 if(role==='teacher'){
  cloudTeacher=true;
  unsubscribeState=onSnapshot(path('state','main'),snap=>{
    if(pendingWrites===0){const state=snap.exists()?snap.data().state:null;knownStudentUids=new Set((state?.students||[]).filter(s=>s.authUid).map(s=>s.authUid));window.DongmenV5.updateTeacher(state);}
  },err=>window.DongmenV5.authError('班級資料讀取失敗：'+err.message));
  unsubscribeRequests=onSnapshot(collectionPath('requests'),snap=>{
    window.DongmenV5.updateRequests(snap.docs.map(d=>({id:d.id,...d.data()})));
  },err=>window.DongmenV5.authError('申請紀錄讀取失敗：'+err.message));
 }else{
  cloudTeacher=false;
  unsubscribeState=onSnapshot(path('studentViews',user.uid),snap=>{
    window.DongmenV5.updateStudent(snap.exists()?snap.data():null);
  },err=>window.DongmenV5.authError('學生資料讀取失敗：'+err.message));
  unsubscribeRequests=onSnapshot(query(collectionPath('requests'),where('ownerUid','==',user.uid)),snap=>{
    window.DongmenV5.updateRequests(snap.docs.map(d=>({id:d.id,...d.data()})));
  },err=>window.DongmenV5.authError('學生申請紀錄讀取失敗：'+err.message));
 }
}
window.DongmenCloud={
 configured,
 async login(role,username,password){
  if(!configured)throw Error('尚未設定 Firebase');
  signInType=role;
  const email=role==='teacher'?username:(username.includes('@')?username.toLowerCase():username.toLowerCase()+'@'+cfg.projectId+'.firebaseapp.com');
  let user;
  try{user=(await signInWithEmailAndPassword(auth,email,password)).user} catch(e){throw readableError(e)}
  if(role==='teacher'){
    const roleDoc=await getDoc(doc(db,'teachers',user.uid));
    if(!roleDoc.exists()||roleDoc.data().enabled!==true){await signOut(auth);throw Error('此帳號尚未獲授權為教師，請先設定 teachers/{教師 UID}');}
    window.DongmenV5.cloudTeacher(null);
  }else{
    const stud=await getDoc(path('studentViews',user.uid));
    if(!stud.exists()){const uid=user.uid;await signOut(auth);throw Error('帳號密碼驗證成功，但尚未綁定存摺。請老師先在 Firebase Authentication 的 Users 核對帳號，再使用教師後台「綁定既有帳號」。此次登入 UID：'+uid+'（請勿提供密碼）');}
    window.DongmenV5.cloudStudent(stud.data());
  }
  startListening(role,user);
 },
 async logout(){unsubscribeState();unsubscribeRequests();await signOut(auth);window.DongmenV5.logout()},
 saveTeacher(state){
  if(!cloudTeacher)return Promise.reject(Error('只有教師可修改班級資料'));
  // Queue state snapshots, preserving click order while Firestore writes are in flight.
  pendingWrites++;
  writes=writes.catch(()=>{}).then(async()=>{
    const batch=writeBatch(db);
    batch.set(path('state','main'),{state,updatedAt:serverTimestamp()});
    const currentUids=new Set((state.students||[]).filter(s=>s.authUid).map(s=>s.authUid));
    for(const s of state.students||[]){if(s.authUid)batch.set(path('studentViews',s.authUid),createStudentView(s,state));}
    for(const uid of knownStudentUids){if(!currentUids.has(uid))batch.delete(path('studentViews',uid));}
    await batch.commit();knownStudentUids=currentUids;
  }).finally(()=>{pendingWrites--;});
  return writes.catch(e=>{throw readableError(e)});
 },
 whenSaved(){return writes;},
 async createStudentAccount(st,assignedPassword){
  if(!cloudTeacher||!auth?.currentUser)throw Error('請先登入正式教師帳號');
  const password=String(assignedPassword??'');
  if(password.length<8||password.length>30||! /^[\x21-\x7E]+$/.test(password))throw Error('學生密碼需為 8～30 碼英數或英文符號');
  const alphabet='abcdefghjkmnpqrstuvwxyz23456789';
  const random=(count)=>{const bytes=new Uint32Array(count);crypto.getRandomValues(bytes);return Array.from(bytes,n=>alphabet[n%alphabet.length]).join('')};
  const loginName=`c${code}s${st.id}${random(5)}`;
  // The project Firebase domain is syntactically valid and unique to this school application.
  const email=loginName+'@'+cfg.projectId+'.firebaseapp.com';
  let created;
  try{created=await createUserWithEmailAndPassword(provisionAuth,email,password)}
  catch(e){throw readableError(e)}
  try{await signOut(provisionAuth)}catch(e){};
  return {uid:created.user.uid,username:loginName,password,email};
 },
 async checkStudentView(uid){
  if(!cloudTeacher)throw Error('僅教師可以檢查學生存摺');
  const snap=await getDoc(path('studentViews',uid));
  return snap.exists()?snap.data():null;
 },
 getTeacherUid(){return cloudTeacher?auth?.currentUser?.uid:null;},
 async revokeOldView(uid){if(cloudTeacher)await deleteDoc(path('studentViews',uid));},
 async submitRequest(data){
  if(!auth?.currentUser||cloudTeacher)throw Error('請先登入學生帳號');
  const current=await getDoc(path('studentViews',auth.currentUser.uid));
  if(!current.exists()||current.data().student.id!==data.studentId)throw Error('學生身份不符');
  const requestData={ownerUid:auth.currentUser.uid,studentId:data.studentId,kind:data.kind,
    rewardId:data.kind==='redeem'?data.rewardId:'',ticketId:data.kind==='use'?data.ticketId:'',
    status:'pending',createdAt:serverTimestamp()};
  await addDoc(collectionPath('requests'),requestData);
 },
 async cancelRequest(id){
  if(!auth.currentUser||cloudTeacher)throw Error('僅學生可取消自己的待處理申請');
  await updateDoc(path('requests',id),{status:'cancelled'});
 },
 async resolveRequest(id,status){
  if(!cloudTeacher)throw Error('只有教師可審核');
  await updateDoc(path('requests',id),{status,resolvedAt:serverTimestamp()});
 }
};
if(configured){
 try{
  const app=initializeApp(cfg);const provisionApp=initializeApp(cfg,'student-account-provisioner');
  auth=getAuth(app);provisionAuth=initializeAuth(provisionApp,{persistence:inMemoryPersistence});db=getFirestore(app);
  window.DongmenV5.cloudReady(true);
  // Do not automatically select the teacher role from prior sign-in; explicit login avoids role confusion.
  onAuthStateChanged(auth,()=>{});
 }catch(e){window.DongmenV5.authError('Firebase 初始化失敗：'+e.message)}
}else{window.DongmenV5.cloudReady(false)}
</script>
<script>
(function(){
  const setup=window.DONGMEN_CLOUD_SETUP||{};
  const cfg=setup.firebaseConfig||{};
  const ready=!!(cfg.apiKey&&cfg.authDomain&&cfg.projectId&&cfg.appId);
  if(!ready){
    // 離線版完全不需網路，也不需要執行 ES Modules。
    window.DongmenV5?.cloudReady(false);
    return;
  }
  if(location.protocol==='file:'){
    window.DongmenV5?.cloudReady(false);
    window.DongmenV5?.authError('已填 Firebase 設定，但本機 file:// 開啟不適合正式登入。請部署到 HTTPS 網站後使用；目前可先用下方示範按鈕。');
    return;
  }
  const source=document.getElementById('dongmen-firebase-source')?.textContent||'';
  const tag=document.createElement('script');
  tag.type='module';
  tag.textContent=source;
  tag.onerror=()=>window.DongmenV5?.authError('Firebase 程式載入失敗，請確認網路與網頁部署網址。');
  document.body.appendChild(tag);
})();
</script>
